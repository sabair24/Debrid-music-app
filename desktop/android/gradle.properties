org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter 3.50 (14-11-2026): AGP 9 met de oude DSL en de losse Kotlin-plug-in, zoals het sjabloon van
# Flutter 3.50 het zet. Zonder deze twee breken plug-ins die nog de oude variant-API of kotlin-android
# gebruiken.
android.newDsl=false
android.builtInKotlin=false
# flutter_inappwebview_android 1.1.3 (de nieuwste stabiele; 14-11-2026) vraagt getDefaultProguardFile('proguard-android.txt'),
# en AGP 9 weigert dat. Tijdelijk toegestaan tot de plug-in proguard-android-optimize.txt gebruikt.
android.r8.proguardAndroidTxt.disallowed=false
