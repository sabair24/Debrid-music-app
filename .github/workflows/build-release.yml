name: Build & Release APK

on:
  push:
    # `claude/**` zijn proefbouwen: compileert het, en draagt de APK de goede handtekening. Ze
    # publiceren niets — dat hangt alleen aan de tag hieronder.
    #
    # `!claude/release` is geen tak met werk erop maar de belknop van release.yml. Zonder deze
    # uitzondering bouwt elke release eerst nog een APK die nergens heen gaat.
    #
    # `main` stond hier ook, en dat was de fout: een duw daarheen BOUWDE niet alleen, hij
    # publiceerde ook. Main lag sinds 27 juli stil terwijl het werk elders doorging, dus die weg
    # naar buiten leverde alleen nog een app van juli. Sinds release.yml loopt elke release over
    # een tag; main hoeft hier niet meer in te staan en hoort er niet meer in.
    branches: [ "claude/**", "!claude/release" ]
    # The release tag builds every platform. Without this the APK only ever came from a push to
    # main or a claude/** branch, so work living on a feature branch shipped to Windows, the Mac and
    # the iPad while Android silently stayed weeks behind — which is exactly what happened.
    tags:
      - 'win-v*'
  pull_request:
    # De tak waar de app op staat, niet main. Dit vuurde na de wissel van standaardtak nooit meer,
    # en een regel die niets bewaakt leest als een regel die iets bewaakt. Zo krijgt ELKE PR naar de
    # app-tak zijn bouw, ook eentje die niet van een `claude/`-tak komt.
    branches: [ "feat/windows-desktop-app" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The build number is also the versionCode, and Android refuses to install a versionCode
      # lower than the one already on the device. The Kotlin app's own pipeline reached 10281 on
      # this same counter, so the offset must stay well above that or every phone and Shield that
      # has the old app would reject the update as a downgrade.
      #
      # 13-08-2026: van 10300 naar 10400. Reden: een reeks APK's is op de pc zelf gebouwd (met de
      # nummers 10830 t/m 10844) omdat een CI-bouw nog een kwartier duurde en de telefoon meteen
      # nagekeken moest worden. Die lokale nummers liepen vóór op de teller hier, en daarmee bood de
      # ingebouwde updater niets meer aan: elke CI-bouw was voor het toestel een stap terug.
      #
      # Zelfde val als hierboven, alleen andersom. Bouw je lokaal, kies dan een nummer dat ONDER
      # deze teller ligt, of til deze offset er meteen overheen -- de teller kan alleen omhoog.
      - name: Compute build number
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} + 10400 ))" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Pinned to the same version this app is developed against. url_launcher_ios needs 3.38+,
      # and a floating "stable" would move under us.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Fetch dependencies
        working-directory: desktop
        run: flutter pub get

      # **Analyse, hier en niet alleen in de Apple-bouw.**
      #
      # Deze stap stond alleen in `apple_build.yml`, en die draait alleen op een TAG. Dus kwam een
      # ongebruikte import pas aan het licht toen de release al liep — en dan is de APK er wel,
      # maar hangt de Mac-app niet aan de uitgave en krijgt de iPad niets. Dat is precies wat er
      # met win-v3.9.158 gebeurde: `dart:isolate` bleef in main.dart staan nadat de kleurberekening
      # naar artwork.dart verhuisd was.
      #
      # `--no-fatal-infos` en dus WEL fatale waarschuwingen: dat is exact wat de Apple-bouw doet, en
      # als deze soepeler zou zijn dan zegt hij niets over wat daar gaat gebeuren.
      - name: Analyze
        working-directory: desktop
        run: flutter analyze --no-fatal-infos lib/

      # De toetsen die over de indeling gaan, hier en niet alleen in de Apple-bouw.
      #
      # Die draait namelijk alleen op een tag, dus een kapotte toets bleek pas tijdens het uitgeven
      # — zo brak win-v3.9.142 en kwam er die dag geen Mac-versie uit. Deze bouw draait óók op elke
      # `claude/**`-tak, en dat is waar een fout thuishoort: vóór het samenvoegen.
      #
      # Een handvol, en met opzet: dit zijn de toetsen die zonder toestel en zonder netwerk iets
      # kunnen zeggen. De hele map duurt minuten en wacht op het net.
      #
      # `lan_client_test.dart` staat er sinds win-v3.9.166 bij, en om precies de reden die hierboven
      # staat: die uitgave leverde een Android- en een Windows-versie op maar geen Mac, omdat één
      # toets in dát bestand zakte. Het is de toets die de pc en een toestel naast elkaar legt — dus
      # juist het bestand dat merkt wanneer die twee uit elkaar gaan lopen. Hij draait op MockClient,
      # raakt het net niet, en kost een seconde.
      - name: Layout and parsing tests
        working-directory: desktop
        run: |
          flutter test \
            test/onderbalk_test.dart test/artiestkop_knoppen_test.dart \
            test/uitgave_rij_test.dart \
            test/offline_test.dart test/catalogus_kopie_test.dart \
            test/lossless_want_test.dart test/bron_venster_test.dart \
            test/terug_test.dart test/binnen_navigator_test.dart \
            test/itemmenu_test.dart \
            test/maten_test.dart test/afmetingen_test.dart \
            test/kleurenladder_test.dart test/overgang_test.dart \
            test/was_test.dart test/binnenkomst_test.dart \
            test/speelvlak_test.dart test/cache_snoei_test.dart \
            test/vastgezette_persing_test.dart test/catalogus_inpakken_test.dart \
            test/rollen_sync_test.dart test/startsnelheid_test.dart \
            test/hoes_sync_test.dart test/oud_albumobject_test.dart \
            test/hoes_navraag_test.dart test/lan_client_test.dart \
            test/acoustid_test.dart test/glasbalk_test.dart \
            test/echtheid_test.dart \
            test/wasuitlijning_test.dart test/schrijffout_test.dart \
            test/completeness_test.dart \
            test/discogs_verwijzing_test.dart test/updater_test.dart \
            test/verhuizing_test.dart test/fingerprint_test.dart \
            test/uitvoerbaar_test.dart test/tv_bovenbalk_test.dart \
            test/albumraster_ingebed_test.dart \
            test/bestandsbeheer_test.dart test/hoesherkomst_test.dart \
            test/metadata_bronnen_test.dart test/castgrenzen_test.dart \
            test/hoes_overname_test.dart test/tiddl_test.dart \
            test/tidal_test.dart test/tidal_zoeken_test.dart \
            test/rutracker_codetabel_test.dart \
            test/slsk_groepen_test.dart \
            test/versie_uit_map_test.dart test/soulseek_query_test.dart \
            test/wat_is_nieuw_test.dart test/heropname_test.dart \
            test/place_file_test.dart test/authority_test.dart \
            test/wat_je_typte_test.dart test/renumber_test.dart \
            test/zoek_geheugen_test.dart test/cuesheet_test.dart \
            test/zoekzeef_test.dart test/rutracker_koekjes_test.dart \
            test/rutracker_meldingen_test.dart test/torbox_stand_test.dart \
            test/remote_work_test.dart test/nu_speelt_namen_test.dart \
            test/bronnen_stand_test.dart test/torznab_test.dart \
            test/cue_knippen_test.dart test/aria2_selectie_test.dart \
            test/uitdaging_zin_test.dart test/versieregel_test.dart \
            test/meldrem_test.dart test/hoesindex_test.dart \
            test/catalogus_bytes_test.dart test/infohash_bytes_test.dart \
            test/schijf_buiten_test.dart test/bronzeef_test.dart \
            test/correctie_velden_test.dart test/tragere_klokken_test.dart \
            test/stroomstand_test.dart test/netsoort_test.dart \
            test/omzetrecept_test.dart test/bijwerkstand_test.dart \
            test/stilstandwacht_test.dart test/einde_of_breuk_test.dart \
            test/normalise_tags_test.dart \
            test/schudvolgorde_test.dart test/cast_control_test.dart \
            test/wachtrij_bewerken_test.dart test/wachtrij_radio_test.dart \
            test/radiovoorraad_test.dart

      # Release, not debug. The debug build carries applicationIdSuffix ".dev" so it can sit beside
      # the app you actually use while the TV work is in progress — shipping that would install a
      # second icon rather than update the first. It is also 103MB against release's 40.
      #
      # arm64 only: media_kit ships libmpv as a native library per architecture, and both the Shield
      # and any current phone are arm64. Carrying four triples the APK for nothing.
      # The release keystore, from repository secrets. Absent secrets are not an error: the Gradle
      # config falls back to the debug key and says so in the log, which is how every APK was signed
      # before. What must never happen is a debug-signed APK passing for a signed one, so the step
      # below states which of the two it is.
      - name: Write the signing key
        working-directory: desktop/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          # TWEE namen, en de tweede is geen luxe.
          #
          # Het wachtwoord van de keystore staat in deze repo onder ANDROID_KEYSTORE_PASSWORD; deze
          # werkstroom zocht alleen ANDROID_STORE_PASSWORD. Eén woordje verschil, en het gevolg was
          # dat de APK's vier dagen lang met de DEBUG-sleutel ondertekend werden -- waardoor geen
          # enkele update over de app op het toestel heen kon en er telkens eerst verwijderd moest
          # worden.
          #
          # Er is geen "juiste" naam van de twee; dat is precies het punt. Een keystore-wachtwoord
          # heet in de ene handleiding zo en in de andere zo, en de bouw hoort niet stuk te gaan aan
          # welke van de twee je toevallig getypt hebt. `||` neemt de eerste die gevuld is.
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # WELK geheim ontbreekt, bij naam. De oude regel zei alleen "geen
          # ANDROID_KEYSTORE_BASE64" en noemde de andere twee niet eens, terwijl elk van de drie deze
          # `if` laat omslaan. Er stonden geheimen in de repo en de APK werd tóch met de debug-sleutel
          # ondertekend, en uit deze stap was met geen mogelijkheid op te maken welke van de drie het
          # was. Nooit de WAARDE, alleen of hij er is.
          ONTBREEKT=""
          [ -n "$KEYSTORE_B64" ]   || ONTBREEKT="$ONTBREEKT ANDROID_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || ONTBREEKT="$ONTBREEKT ANDROID_STORE_PASSWORD(_of_ANDROID_KEYSTORE_PASSWORD)"
          [ -n "$KEY_ALIAS" ]      || ONTBREEKT="$ONTBREEKT ANDROID_KEY_ALIAS"

          if [ -z "$ONTBREEKT" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=${KEY_PASSWORD:-$STORE_PASSWORD}"
            } > key.properties
            echo "SIGNED=ja" >> "$GITHUB_ENV"
            echo "Release-sleutel geschreven; de APK wordt echt gesigneerd."
            # Alleen of hij er is, niet hoe lang of wat erin staat.
            [ -n "$KEY_PASSWORD" ] || echo "ANDROID_KEY_PASSWORD is leeg; dan geldt het store-wachtwoord ook voor de sleutel."
          else
            echo "SIGNED=nee" >> "$GITHUB_ENV"
            echo "::warning::Deze geheimen ontbreken of zijn leeg:${ONTBREEKT}. De APK krijgt de DEBUG-sleutel."
            echo "Staan ze er wél, kijk dan of ze onder Settings → Secrets and variables → ACTIONS staan"
            echo "(en niet onder Dependabot of Codespaces), in DEZE repo, en of de naam exact klopt."
          fi

      - name: Build release APK
        working-directory: desktop
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-name "${VERSION}" \
            --build-number "${BUILD_NUMBER}"
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/DebridMusic-v${VERSION}-build${BUILD_NUMBER}.apk"
          echo "APK_NAME=DebridMusic-v${VERSION}-build${BUILD_NUMBER}.apk" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      # Read the certificate back OUT of the finished APK rather than trusting what we think we
      # configured. A debug key identifies itself: "CN=Android Debug, O=Android, C=US".
      #
      # The first version of this step printed one line and then nothing — no certificate, and no
      # "apksigner not found" either. It had piped apksigner straight into grep with `|| true`, so a
      # tool that wrote to stderr, or failed outright, produced silence that read exactly like a pass.
      # A check that cannot run must SAY so and fail when it matters, or it is worse than no check:
      # it is a green tick over an unanswered question.
      - name: Say which key actually signed it
        working-directory: desktop
        run: |
          APK="build/app/outputs/flutter-apk/${APK_NAME}"
          echo "verwacht: gesigneerd=${SIGNED}"
          echo "APK: $APK"
          if [ ! -f "$APK" ]; then
            echo "::error::De APK staat niet waar hij verwacht wordt — de controle kon niet lopen."
            ls -la build/app/outputs/flutter-apk/ || true
            exit 1
          fi

          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1 || true)
          echo "apksigner: ${SIGNER:-<niet gevonden>}"

          CERTS=""
          if [ -n "$SIGNER" ]; then
            # stderr erbij: apksigner schrijft een deel van zijn uitvoer daarheen, en dat was precies
            # wat de vorige versie kwijtraakte.
            # --verbose voegt de regels toe die zeggen WELKE handtekeningschema's erin zitten. Zonder
            # dat stond hier alleen wie het ondertekend heeft, en niet hoe.
            CERTS=$("$SIGNER" verify --verbose --print-certs "$APK" 2>&1) || true
          fi
          if [ -z "$CERTS" ] && command -v keytool >/dev/null 2>&1; then
            # Reservepad: keytool leest de signature block net zo goed.
            CERTS=$(keytool -printcert -jarfile "$APK" 2>&1) || true
          fi

          if [ -z "$CERTS" ]; then
            echo "Kon het certificaat niet uitlezen."
            if [ "$SIGNED" = "ja" ]; then
              echo "::error::Er is een sleutel geschreven, maar niet te controleren of de APK hem draagt."
              exit 1
            fi
            echo "Niet fataal: deze build hoort debug-gesigneerd te zijn."
            exit 0
          fi

          # De VINGERAFDRUK hoort in het log, want dat is het enige getal waarmee twee bouwen te
          # vergelijken zijn. Het oude patroon zocht op "Signer #1 certificate", en apksigner schrijft
          # "V2 Signer: certificate SHA-256 digest:" — dus viel het altijd terug op `head -20` en was
          # het toeval dat de afdruk er toch bij stond.
          echo "$CERTS" | grep -iE "owner|Signer.*certificate (DN|SHA-256)" || echo "$CERTS" | head -20

          if echo "$CERTS" | grep -qi "Android Debug"; then
            echo "Dit is de DEBUG-sleutel."
            if [ "$SIGNED" = "ja" ]; then
              echo "::error::De sleutel is geschreven maar de APK draagt nog het debug-certificaat."
              exit 1
            fi
            # EEN RELEASE MAG DIT NIET ZIJN.
            #
            # De debug-sleutel wordt door de bouwmachine ter plekke aangemaakt als hij er niet staat,
            # en elke draai is een verse machine. Gemeten: build 11028 droeg publieke sleutel
            # 5c95d117…, build 11037 droeg eb08ef40… — twee verschillende sleutels, twee dagen na
            # elkaar. Android weigert een APK over een app te zetten die met een ANDERE sleutel
            # ondertekend is, dus elke nieuwe versie vroeg om eerst verwijderen en opnieuw
            # installeren. Al je instellingen weg, elke keer.
            #
            # Dat is maandenlang gebeurd zonder dat iets het zei: deze stap zette een groen vinkje
            # omdat "debug" bij een proefbouw normaal is, en publiceerde daarna gewoon door. Precies
            # de val die in het commentaar hierboven al beschreven staat -- een groen vinkje boven een
            # onbeantwoorde vraag -- alleen een stap verderop.
            #
            # Op een tag is het dus fataal. Op een claude/-tak blijft het gewoon een proefbouw.
            case "$GITHUB_REF" in
              refs/tags/win-v*)
                echo "::error::Een release met de DEBUG-sleutel. Die installeert niet over de app die op het toestel staat, en de volgende bouw krijgt weer een andere sleutel. Er wordt niets gepubliceerd."
                exit 1
                ;;
            esac
          else
            echo "Dit is NIET de debug-sleutel."
            if [ "$SIGNED" != "ja" ]; then
              echo "::warning::Onverwacht: geen sleutel geschreven, maar het certificaat is niet het debug-certificaat."
            fi
          fi

          # Welke schema's er in zitten. 2.3.6 droeg alleen v2 omdat AGP v3 uit laat staan tenzij je
          # het vraagt, en v3 is wat sleutelrotatie later mogelijk maakt. Gemeten in plaats van
          # aangenomen, om dezelfde reden als het certificaat hierboven.
          echo "$CERTS" | grep -iE "^Verified using" || echo "(geen schemaregels — apksigner draaide zonder --verbose?)"
          if [ "$SIGNED" = "ja" ] && ! echo "$CERTS" | grep -qi "^Verified using v3 scheme.*true"; then
            echo "::error::De APK draagt geen v3-handtekening. enableV3Signing staat uit of is genegeerd."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debrid-music-build${{ env.BUILD_NUMBER }}
          path: desktop/build/app/outputs/flutter-apk/${{ env.APK_NAME }}
          retention-days: 30

      # Publishes only the built APK to a SEPARATE PUBLIC repo so the in-app updater can read releases
      # and download the APK without authentication. That was written when this source repo was
      # private; it is public now, so the split is no longer load-bearing — but the updater points at
      # that repo, and moving it would break every phone already carrying the app.
      #
      # The tag has to be here too. Adding win-v* to this workflow made the APK BUILD on a release
      # tag, and it went green — but this step still only fired for main, so the artifact was built
      # and never published. A green Android build that no phone can see is the same as no build.
      #
      # Alleen de tag nog, main niet meer. Een duw naar main publiceerde hier een APK naar de
      # openbare repo, en dat is precies hoe er op 19-08 een app van 27 juli op een telefoon
      # terechtkwam: main lag sinds die datum stil, en niets zei dat. Een release loopt sinds
      # release.yml altijd over een tag, dus deze tweede weg naar buiten kon alleen nog per
      # ongeluk gebruikt worden.
      #
      # **Waarom deze stap wacht in plaats van te zakken.** Twee keer op één dag (build 11215 en
      # 11218) zakte hier alleen dít: `API rate limit exceeded for user ID 36713342`. De APK was
      # gebouwd, ondertekend en gecontroleerd; hij kwam alleen de deur niet uit. Dat is geen fout in
      # de code en er valt niets aan te repareren — je moet wachten. De oude opzet maakte daar een
      # rode bouw van, en dus een handmatige "Re-run failed jobs" op een moment dat niemand kan
      # weten.
      #
      # GitHub zégt wanneer er weer ruimte is: `rate_limit` geeft het tijdstip, en dat opvragen telt
      # zelf niet mee. Dus eerst kijken, zo nodig slapen tot dat tijdstip, dan pas publiceren. Beide
      # repo's zijn openbaar, dus wachten op een Ubuntu-machine kost geen minuten — het kost alleen
      # kloktijd, en die is hier goedkoper dan jouw aandacht.
      #
      # De limiet is er één per gebruiker, niet per token: elk klassiek toegangstoken van dit account
      # deelt dezelfde 5000 verzoeken per uur. Wachten lost het symptoom op; wie de bron structureel
      # wil scheiden geeft deze stap een eigen token via een GitHub App.
      #
      # En `gh` in plaats van een kant-en-klare actie, om twee redenen: het zijn merkbaar minder
      # verzoeken (drie in plaats van een handvol, en dat is precies de schaarste hier), en een
      # herhaalde poging wordt hiermee gewoon leesbare shell in plaats van een derde partij die de
      # foutcode achter een groen vinkje kan wegmoffelen.
      # WAT ER IN DEZE UITGAVE ZIT, in gewone zinnen.
      #
      # De melding op de telefoon zei alleen "build 11300 staat klaar" — een nummer, en verder
      # niets. Je moest maar aannemen dat het de moeite was. De onderwerpsregels van de commits
      # sinds de vorige uitgave zijn precies wat er nodig is: die staan hier al in gewone taal, dus
      # er valt niets te vertalen.
      #
      # De checkout is ondiep (dat hoort ook, op elke tak-bouw), dus hier wordt hij verdiept — maar
      # alleen bij het uitgeven, niet bij elke push. Lukt dat niet, dan blijft de lijst leeg en zegt
      # het venster gewoon niets over de inhoud; dat is beter dan een halve lijst die stellig oogt.
      - name: Wat er in deze uitgave zit
        if: startsWith(github.ref, 'refs/tags/win-v')
        run: |
          set -uo pipefail
          git fetch --unshallow --tags --quiet 2>/dev/null || git fetch --tags --quiet 2>/dev/null || true

          DEZE="${GITHUB_REF#refs/tags/}"
          VORIGE=$(git tag -l 'win-v*' --sort=-v:refname | grep -v "^${DEZE}$" | head -1 || true)

          if [ -z "$VORIGE" ]; then
            echo "Geen vorige win-v-tag gevonden; dan maar zonder lijst."
            REGELS=""
          else
            echo "Veranderingen tussen $VORIGE en $DEZE:"
            # Alleen de eerste regel per commit, geen samenvoegingen, en de lege uitgeef-commits
            # eruit — "Uitgeven: ..." zegt niets over wat de app doet.
            REGELS=$(git log --no-merges --format='%s' "${VORIGE}..${DEZE}" \
              | sed 's/ (#[0-9]*)$//' \
              | grep -v '^Uitgeven:' \
              | grep -v '^Merge ' \
              | head -8 || true)
          fi

          {
            # De scheider gaat ZONDER aanhalingstekens naar $GITHUB_ENV — dat is de vorm die
            # GitHub leest. Met aanhalingstekens zoekt hij naar een afsluitregel die er niet komt.
            echo "WAT_NIEUW<<EOF_WAT_NIEUW"
            echo "$REGELS"
            echo "EOF_WAT_NIEUW"
          } >> "$GITHUB_ENV"
          echo "$REGELS"

      - name: Publish APK to public releases repo
        if: startsWith(github.ref, 'refs/tags/win-v') && env.RELEASES_TOKEN != ''
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          DOEL: sabair24/Debrid-music-app-releases
        run: |
          set -uo pipefail
          apk="desktop/build/app/outputs/flutter-apk/${APK_NAME}"
          tag="v${VERSION}-build${BUILD_NUMBER}"
          [ -f "$apk" ] || { echo "::error::De APK staat niet waar hij verwacht wordt: $apk"; exit 1; }

          cat > "$RUNNER_TEMP/notities.md" <<EOF
          ## DebridMusic v${VERSION} (build ${BUILD_NUMBER})

          Dezelfde app als op je pc, Mac en iPad — één codebase, ook op Android en Android TV.

          ### Installeren
          Download de APK hieronder en installeer hem op je telefoon of je Shield. Hij vervangt
          de app die er staat; daarna één keer opnieuw inloggen met je account.

          > Mogelijk moet je "Installeren uit onbekende bronnen" aanzetten.

          Alleen arm64.
          EOF

          # ACHTERAAN, en dat is geen opmaak maar een eis. `watIsNieuw` in updater.dart leest de
          # regels ónder dit kopje tot het volgende kopje of tot het eind. Staat er daarna nog
          # gewone tekst, dan komt die als "wijziging" in het updatevenster te staan.
          #
          # Het kopje zelf is een AFSPRAAK met de app en moet letterlijk zo blijven: verandert hij
          # hier, dan valt de lijst op de telefoon stil zonder dat er iets rood wordt.
          if [ -n "${WAT_NIEUW:-}" ]; then
            {
              echo
              echo "## Wat er nieuw is"
              echo
              echo "${WAT_NIEUW}" | sed 's/^/- /'
            } >> "$RUNNER_TEMP/notities.md"
          fi

          # Wacht tot er weer ruimte is. Geeft 1 terug als het wachten langer zou duren dan een uur —
          # dat kan niet, want een limiet loopt binnen het uur af, dus dan is er iets anders aan de
          # hand en is stilzwijgend blijven hangen het verkeerde antwoord.
          gewacht=0
          ruimte() {
            for ronde in 1 2 3; do
              lees=$(gh api rate_limit --jq '"\(.resources.core.remaining) \(.resources.core.reset)"' 2>/dev/null) || {
                echo "Kon de limiet niet uitlezen; dan maar gewoon proberen."
                return 0
              }
              over=${lees%% *}; reset=${lees##* }
              if [ "$over" -ge 20 ]; then
                echo "Ruimte genoeg: nog $over verzoeken tot $(date -u -d "@$reset" +%H:%M) UTC."
                return 0
              fi
              slaap=$(( reset - $(date +%s) + 15 ))
              [ "$slaap" -lt 15 ] && slaap=15
              # Een limiet loopt binnen het uur af, dus meer dan dat wachten kan niet kloppen. En in
              # totaal nooit langer dan ruim een uur: eeuwig blijven hangen is geen betere afloop dan
              # zakken, alleen een duurdere.
              if [ "$slaap" -gt 3900 ] || [ $(( gewacht + slaap )) -gt 4200 ]; then
                echo "::error::Nog $over verzoeken over en de teller loopt pas af om $(date -u -d "@$reset" +%H:%M) UTC. Zo lang wachten hoort niet nodig te zijn."
                return 1
              fi
              echo "::notice::Nog $over verzoeken over. Wachten tot $(date -u -d "@$reset" +%H:%M) UTC (${slaap}s) — de APK is klaar, alleen het publiceren wacht."
              sleep "$slaap"
              gewacht=$(( gewacht + slaap ))
            done
            return 0
          }

          publiceer() {
            if gh release view "$tag" --repo "$DOEL" >/dev/null 2>&1; then
              # Bestaat al — dat is een herhaalde poging, geen fout. Alleen het bestand erover.
              gh release upload "$tag" "$apk" --repo "$DOEL" --clobber
            else
              gh release create "$tag" "$apk" --repo "$DOEL" \
                --title "DebridMusic v${VERSION} (build ${BUILD_NUMBER})" \
                --notes-file "$RUNNER_TEMP/notities.md"
            fi
          }

          for poging in 1 2 3; do
            ruimte || exit 1
            if publiceer; then
              echo "Gepubliceerd als $tag op $DOEL (poging $poging)."
              exit 0
            fi
            echo "Poging $poging mislukt."
            [ "$poging" -lt 3 ] && sleep $(( poging * 30 ))
          done

          echo "::error::Publiceren lukte na drie pogingen niet. De APK zit wel bij de artefacten van deze bouw."
          exit 1
