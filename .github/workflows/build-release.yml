name: Build & Release APK

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The build number is also the versionCode, and Android refuses to install a versionCode
      # lower than the one already on the device. The Kotlin app's own pipeline reached 10281 on
      # this same counter, so the offset must stay well above that or every phone and Shield that
      # has the old app would reject the update as a downgrade.
      - name: Compute build number
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} + 10300 ))" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Pinned to the same version this app is developed against. url_launcher_ios needs 3.38+,
      # and a floating "stable" would move under us.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Fetch dependencies
        working-directory: desktop
        run: flutter pub get

      # The signing key, for the length of this run.
      #
      # Without it the build falls back to the debug key, and a debug key is generated fresh on
      # every runner — so every APK was signed by a different key and Android refused to install
      # one over another. Skipped rather than failed when the secret is absent: a fork, or this
      # repository before the key was added, still gets a build.
      - name: Unlock the signing key
        # env and not secrets: the two publish steps below already prove this form works here.
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debridmusic.jks"
          echo "DEBRIDMUSIC_KEYSTORE=$RUNNER_TEMP/debridmusic.jks" >> "$GITHUB_ENV"

      # This workflow is the only one that runs on an ordinary push, so it is the only place a
      # change to the app is checked before it lands on a phone. The Apple workflow runs the full
      # twenty-file list, but only on a release tag — by then the APK has been installed for days.
      - name: Analyze
        working-directory: desktop
        # --no-fatal-infos matches the Apple workflow: two style infos in discogs.dart predate both.
        # Warnings and errors still stop the build.
        run: flutter analyze --no-fatal-infos lib/

      # The layout tests, named rather than the whole suite: five tests here scan a Windows music
      # folder or call out to the network and would fail for reasons that have nothing to do with
      # the build. These two cover what a phone build can silently get wrong — a section that is in
      # one navigation and not the other, and a bar that fits the emulator but not a 320-point
      # screen.
      - name: Test the layout
        working-directory: desktop
        run: flutter test test/nav_sections_test.dart test/phone_layout_test.dart

      # Release, not debug. The debug build carries applicationIdSuffix ".dev" so it can sit beside
      # the app you actually use while the TV work is in progress — shipping that would install a
      # second icon rather than update the first. It is also 103MB against release's 40.
      #
      # arm64 only: media_kit ships libmpv as a native library per architecture, and both the Shield
      # and any current phone are arm64. Carrying four triples the APK for nothing.
      - name: Build release APK
        working-directory: desktop
        env:
          DEBRIDMUSIC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DEBRIDMUSIC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DEBRIDMUSIC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-name "${VERSION}" \
            --build-number "${BUILD_NUMBER}"
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/DebridMusic-v${VERSION}-build${BUILD_NUMBER}.apk"
          echo "APK_NAME=DebridMusic-v${VERSION}-build${BUILD_NUMBER}.apk" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      # Which key actually signed this, in the log and in the release notes.
      #
      # Otherwise the only way to find out is to install the thing and see whether Android refuses.
      # The fingerprint is the whole answer: two builds that share it can update each other, two
      # that do not never will, and a fingerprint that changes between runs means the build is
      # still falling back to a debug key that every runner generates for itself.
      - name: Say which key signed it
        working-directory: desktop
        continue-on-error: true
        run: |
          APK="build/app/outputs/flutter-apk/${APK_NAME}"
          SIGNER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner 2>/dev/null | sort | tail -1)
          if [ -n "$SIGNER" ]; then
            CERTS=$("$SIGNER" verify --print-certs "$APK" 2>/dev/null || true)
          else
            CERTS=$(keytool -printcert -jarfile "$APK" 2>/dev/null || true)
          fi
          FP=$(printf '%s' "$CERTS" | grep -i -m1 'SHA-256' | tr -d ' ' | cut -d: -f2- || true)
          if [ -n "${DEBRIDMUSIC_KEYSTORE:-}" ]; then
            KEY="de vaste release-sleutel"
          else
            KEY="de DEBUG-sleutel (elke runner maakt zijn eigen — bijwerken kan niet)"
          fi
          echo "Ondertekend met: $KEY"
          echo "SHA-256: ${FP:-onbekend}"
          echo "SIGNED_WITH=$KEY" >> "$GITHUB_ENV"
          echo "SIGNED_FP=${FP:-onbekend}" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debrid-music-build${{ env.BUILD_NUMBER }}
          path: desktop/build/app/outputs/flutter-apk/${{ env.APK_NAME }}
          retention-days: 30

      # Publishes only the built APK to a SEPARATE PUBLIC repo so the in-app
      # updater can read releases and download the APK without authentication,
      # while this source repo stays private.
      - name: Publish APK to public releases repo
        if: github.ref == 'refs/heads/main' && env.RELEASES_TOKEN != ''
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        uses: softprops/action-gh-release@v2
        with:
          repository: sabair24/Debrid-music-app-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: v${{ env.VERSION }}-build${{ env.BUILD_NUMBER }}
          name: "DebridMusic v${{ env.VERSION }} (build ${{ env.BUILD_NUMBER }})"
          body: |
            ## DebridMusic v${{ env.VERSION }} (build ${{ env.BUILD_NUMBER }})

            Dezelfde app als op je pc, Mac en iPad — één codebase, ook op Android en Android TV.

            ### Installeren
            Download de APK hieronder en installeer hem op je telefoon of je Shield. Hij vervangt
            de app die er staat; daarna één keer opnieuw inloggen met je account.

            > Mogelijk moet je "Installeren uit onbekende bronnen" aanzetten.

            Alleen arm64.
          draft: false
          prerelease: false
          files: desktop/build/app/outputs/flutter-apk/${{ env.APK_NAME }}

      # The same APK off a working branch, published so it can be installed from a phone.
      #
      # The artifact above is the honest place for a test build, but downloading one needs a GitHub
      # login, and typing that on the phone you are trying to test is the reason branch builds went
      # untried. A release is a plain link.
      #
      # Tagged apart and marked prerelease so it can never be taken for a real one. Nothing reads
      # these — there is no in-app updater in this codebase; that went with the Kotlin app — so the
      # only person who ever sees a test build is the one who went looking for it.
      - name: Publish a test build to the public releases repo
        if: startsWith(github.ref, 'refs/heads/claude/') && env.RELEASES_TOKEN != ''
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        uses: softprops/action-gh-release@v2
        with:
          repository: sabair24/Debrid-music-app-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: test-v${{ env.VERSION }}-build${{ env.BUILD_NUMBER }}
          name: "Testbouw ${{ github.ref_name }} (build ${{ env.BUILD_NUMBER }})"
          body: |
            ## Testbouw — nog niet af

            Van de tak `${{ github.ref_name }}`, build ${{ env.BUILD_NUMBER }}. Dit is werk in
            uitvoering, geen uitgave: hij is er om uitgeprobeerd te worden en om er screenshots
            van te sturen.

            ### Installeren
            Download de APK hieronder. Hij heeft dezelfde naam als de app die je gebruikt en
            **vervangt hem dus** — je gewone app is terug zodra je een echte uitgave installeert.
            Je blijft ingelogd.

            > Mogelijk moet je "Installeren uit onbekende bronnen" aanzetten.

            Alleen arm64.

            <sub>Ondertekend met ${{ env.SIGNED_WITH }} · SHA-256 <code>${{ env.SIGNED_FP }}</code><br>
            Blijft die vingerafdruk tussen twee builds gelijk, dan kun je de ene over de andere
            installeren. Verandert hij, dan niet.</sub>
          draft: false
          prerelease: true
          files: desktop/build/app/outputs/flutter-apk/${{ env.APK_NAME }}
