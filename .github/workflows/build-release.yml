name: Build & Release APK

on:
  push:
    branches: [ "main", "claude/**" ]
    # The release tag builds every platform. Without this the APK only ever came from a push to
    # main or a claude/** branch, so work living on a feature branch shipped to Windows, the Mac and
    # the iPad while Android silently stayed weeks behind — which is exactly what happened.
    tags:
      - 'win-v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The build number is also the versionCode, and Android refuses to install a versionCode
      # lower than the one already on the device. The Kotlin app's own pipeline reached 10281 on
      # this same counter, so the offset must stay well above that or every phone and Shield that
      # has the old app would reject the update as a downgrade.
      - name: Compute build number
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} + 10300 ))" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Pinned to the same version this app is developed against. url_launcher_ios needs 3.38+,
      # and a floating "stable" would move under us.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Fetch dependencies
        working-directory: desktop
        run: flutter pub get

      # Release, not debug. The debug build carries applicationIdSuffix ".dev" so it can sit beside
      # the app you actually use while the TV work is in progress — shipping that would install a
      # second icon rather than update the first. It is also 103MB against release's 40.
      #
      # arm64 only: media_kit ships libmpv as a native library per architecture, and both the Shield
      # and any current phone are arm64. Carrying four triples the APK for nothing.
      # The release keystore, from repository secrets. Absent secrets are not an error: the Gradle
      # config falls back to the debug key and says so in the log, which is how every APK was signed
      # before. What must never happen is a debug-signed APK passing for a signed one, so the step
      # below states which of the two it is.
      - name: Write the signing key
        working-directory: desktop/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=${KEY_PASSWORD:-$STORE_PASSWORD}"
            } > key.properties
            echo "SIGNED=ja" >> "$GITHUB_ENV"
            echo "Release-sleutel geschreven; de APK wordt echt gesigneerd."
          else
            echo "SIGNED=nee" >> "$GITHUB_ENV"
            echo "Geen ANDROID_KEYSTORE_BASE64 in de secrets — de APK wordt met de DEBUG-sleutel gesigneerd."
          fi

      - name: Build release APK
        working-directory: desktop
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-name "${VERSION}" \
            --build-number "${BUILD_NUMBER}"
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/DebridMusic-v${VERSION}-build${BUILD_NUMBER}.apk"
          echo "APK_NAME=DebridMusic-v${VERSION}-build${BUILD_NUMBER}.apk" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      # Read back out of the APK itself rather than trusting what we think we configured. The
      # certificate's subject is the difference: a debug key says "CN=Android Debug".
      - name: Say which key actually signed it
        working-directory: desktop
        run: |
          APK="build/app/outputs/flutter-apk/${APK_NAME}"
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1 || true)
          if [ -n "$SIGNER" ]; then
            echo "verwacht: gesigneerd=${SIGNED}"
            "$SIGNER" verify --print-certs "$APK" | grep -i "Signer #1 certificate DN" || true
            if [ "$SIGNED" = "ja" ] && "$SIGNER" verify --print-certs "$APK" | grep -qi "Android Debug"; then
              echo "::error::De sleutel is geschreven maar de APK draagt nog het debug-certificaat."
              exit 1
            fi
          else
            echo "apksigner niet gevonden; overgeslagen."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debrid-music-build${{ env.BUILD_NUMBER }}
          path: desktop/build/app/outputs/flutter-apk/${{ env.APK_NAME }}
          retention-days: 30

      # Publishes only the built APK to a SEPARATE PUBLIC repo so the in-app
      # updater can read releases and download the APK without authentication,
      # while this source repo stays private.
      - name: Publish APK to public releases repo
        if: github.ref == 'refs/heads/main' && env.RELEASES_TOKEN != ''
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        uses: softprops/action-gh-release@v2
        with:
          repository: sabair24/Debrid-music-app-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: v${{ env.VERSION }}-build${{ env.BUILD_NUMBER }}
          name: "DebridMusic v${{ env.VERSION }} (build ${{ env.BUILD_NUMBER }})"
          body: |
            ## DebridMusic v${{ env.VERSION }} (build ${{ env.BUILD_NUMBER }})

            Dezelfde app als op je pc, Mac en iPad — één codebase, ook op Android en Android TV.

            ### Installeren
            Download de APK hieronder en installeer hem op je telefoon of je Shield. Hij vervangt
            de app die er staat; daarna één keer opnieuw inloggen met je account.

            > Mogelijk moet je "Installeren uit onbekende bronnen" aanzetten.

            Alleen arm64.
          draft: false
          prerelease: false
          files: desktop/build/app/outputs/flutter-apk/${{ env.APK_NAME }}
