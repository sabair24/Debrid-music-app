name: Release — alle toestellen in één keer

# EÉN KNOP. Geen tag typen, geen tak kiezen, geen git op je machine.
#
# Actions → "Release — alle toestellen in één keer" → Run workflow. Klaar.
#
# **Waarom dit bestaat.** Releasen ging tot nu toe met `git tag win-v3.9.140` en `git push origin
# win-v3.9.140`, en dat kan alleen op een machine met git erop. Vanaf een telefoon was er geen weg
# naar een release. En de twee dingen die daarbij mis konden gaan waren allebei stil:
#
#   * een nummer dat níét hoger was dan het vorige — die teller mag alleen omhoog, want de
#     Windows-installer schrijft hem als AppVersion en Android weigert een lagere versionCode;
#   * de verkeerde tak — `main` ligt sinds juli stil, en een tag daarop bouwt een app van juli.
#
# Allebei zijn ze hier onmogelijk gemaakt in plaats van opgeschreven.
#
# **Wat deze workflow doet.**
#
#   1. Pakt de tip van de RELEASE-tak hieronder. Vast ingebakken, niet de tak waarvandaan je hem
#      start — laat die keuzelijst dus gerust op `main` staan, dat maakt niets uit.
#   2. Zoekt de hoogste bestaande `win-v`-tag en telt er één bij op. Vul je zelf een nummer in, dan
#      wordt gecontroleerd dat het hoger ligt dan wat er al staat.
#   3. Zet de tag en start de drie bouwen daarop.
#
# **Waarom stap 3 apart moet.** Een tag die vanuit een workflow met de `GITHUB_TOKEN` gepusht wordt,
# start met opzet géén nieuwe workflow — anders bouw je oneindige lussen. `workflow_dispatch` is
# daar de uitzondering op en start wél. Dus wordt de tag gezet én worden de drie apart aangeroepen,
# ÓP die tag: binnen die bouwen is `github.ref` dan `refs/tags/win-v…`, en alles wat daaraan hangt
# (het versienummer in de installer, het publiceren van de release, de Mac-zip die aan de
# Windows-release wordt gehangen) werkt precies als bij een tag van de hand.

on:
  workflow_dispatch:
    inputs:
      versie:
        description: 'Versienummer, bv. 3.9.141 — leeg laten = automatisch één hoger'
        required: false
        default: ''

permissions:
  # De tag zetten.
  contents: write
  # En de drie bouwen aanroepen.
  actions: write

env:
  # De tak waar de app op staat. Staat hier één keer, want dit is het getal dat je niet wilt
  # verkeerd hebben: "windows-desktop-app" is een misleidende naam voor de tak waar het werk voor
  # ALLE VIJF de toestellen op gebeurt.
  TAK: feat/windows-desktop-app

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Haal de release-tak op
        uses: actions/checkout@v4
        with:
          # Niet github.ref: dit moet de release-tak zijn, wat je in de keuzelijst ook koos.
          ref: feat/windows-desktop-app
          # De hele geschiedenis én de tags, want het volgende nummer wordt uit de tags gelezen.
          fetch-depth: 0
          fetch-tags: true

      - name: Bepaal het nummer
        id: nr
        env:
          # Via de omgeving en niet rechtstreeks in het script geplakt: wat je in dat veld typt is
          # tekst, en tekst hoort nooit als shell-opdracht te kunnen eindigen.
          HAND: ${{ inputs.versie }}
        run: |
          set -euo pipefail

          # `|| true`, want `grep` dat niets vindt geeft 1 terug en `pipefail` maakt daar een
          # afgebroken stap van — precies vóór de regel die had kunnen uitleggen wat er mis is.
          HOOGSTE=$(git tag -l 'win-v*' \
            | sed 's/^win-v//' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1 || true)
          if [ -z "$HOOGSTE" ]; then
            echo "::error::Geen enkele win-v-tag gevonden. Dat hoort niet te kunnen; er zijn er meer dan honderd."
            exit 1
          fi
          echo "Hoogste tag nu: win-v$HOOGSTE"

          if [ -n "$HAND" ]; then
            if ! echo "$HAND" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::\"$HAND\" is geen versienummer. Het moet drie getallen met punten zijn, bijvoorbeeld 3.9.141."
              exit 1
            fi
            # Alleen omhoog. Dit is de fout die je pas maanden later merkt: een installer die zich
            # ouder noemt dan wat er staat werkt gewoon niet, en een APK met een lagere versionCode
            # wordt door Android geweigerd als een stap terug.
            LAAGSTE=$(printf '%s\n%s\n' "$HAND" "$HOOGSTE" | sort -V | head -1)
            if [ "$HAND" = "$HOOGSTE" ] || [ "$LAAGSTE" = "$HAND" ]; then
              echo "::error::$HAND ligt niet boven $HOOGSTE. Die teller mag alleen omhoog — kies iets hogers of laat het veld leeg."
              exit 1
            fi
            NIEUW="$HAND"
          else
            IFS=. read -r a b c <<< "$HOOGSTE"
            NIEUW="$a.$b.$((c + 1))"
          fi

          TAG="win-v$NIEUW"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG bestaat al."
            exit 1
          fi

          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "VERSIE=$NIEUW" >> "$GITHUB_OUTPUT"
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "ONDERWERP=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"

      - name: Zet de tag
        env:
          TAG: ${{ steps.nr.outputs.TAG }}
        run: |
          set -euo pipefail
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
          echo "$TAG staat op $(git rev-parse --short HEAD)."

      - name: Start de drie bouwen op die tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.nr.outputs.TAG }}
        run: |
          set -euo pipefail
          # Een net gezette tag is soms een tel of twee later pas te zien voor de API. Dat is geen
          # fout maar een race, dus even opnieuw proberen in plaats van meteen rood worden.
          start() {
            for poging in 1 2 3 4 5; do
              if gh workflow run "$1" --ref "$TAG"; then
                echo "  $1 gestart"
                return 0
              fi
              echo "  $1 nog niet gelukt (poging $poging), even wachten…"
              sleep 6
            done
            echo "::error::$1 kon niet gestart worden op $TAG."
            return 1
          }
          start build-release.yml   # Android-telefoon en Android TV
          start windows_build.yml   # Windows, en de release waar de rest aan hangt
          start apple_build.yml     # Mac en iPad

      - name: Schrijf op wat er gebeurd is
        env:
          TAG: ${{ steps.nr.outputs.TAG }}
          VERSIE: ${{ steps.nr.outputs.VERSIE }}
          COMMIT: ${{ steps.nr.outputs.COMMIT }}
          ONDERWERP: ${{ steps.nr.outputs.ONDERWERP }}
        run: |
          {
            echo "## $TAG"
            echo
            echo "Van de tak \`$TAK\`, op commit \`${COMMIT:0:7}\` — *$ONDERWERP*"
            echo
            echo "Er lopen nu drie bouwen. Samen duren ze zo'n twintig minuten:"
            echo
            echo "| Wat | Waar het terechtkomt |"
            echo "| --- | --- |"
            echo "| Windows | de release \`$TAG\` in deze repo |"
            echo "| Mac | dezelfde release, als zip |"
            echo "| iPad | TestFlight |"
            echo "| Android + Android TV | de APK in de releases-repo |"
            echo
            echo "[Volg ze in het Actions-tabblad](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions)."
          } >> "$GITHUB_STEP_SUMMARY"
