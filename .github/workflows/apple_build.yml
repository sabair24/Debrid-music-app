name: DebridMusic Apple Build

# The Mac and iPad app — the SAME Flutter app as Windows, in desktop/.
#
#   • tag apple-v*      → iPad to TestFlight, Mac app on the GitHub Release
#   • workflow_dispatch → manual run; tick "testflight" to push a build to TestFlight
#
# This replaced a workflow that built a separate SwiftUI app. There is one codebase now, so the
# Mac and the iPad get every feature Windows has by construction rather than by being kept in step.
#
# Deliberately NOT triggered by ordinary pushes. A `paths:` filter alongside `tags:` is ANDed by
# GitHub, so a release tag would be skipped whenever that commit happened to touch nothing under
# desktop/ — and running a macOS job on every push is expensive on a private repository. Use the
# manual run for a check between releases.
#
# The steps that need no secrets always run, so a manual run is useful before any signing is set
# up at all. Signing and distribution only run when the App Store Connect key is configured —
# see the note further down.
on:
  push:
    tags:
      - 'apple-v*'
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Upload the iPad build to TestFlight'
        type: boolean
        default: false

permissions:
  contents: write

env:
  TEAM_ID: DR8YNUC2S7

defaults:
  run:
    working-directory: desktop

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Newer than windows_build.yml's 3.35.6, and on purpose: pubspec.lock pins
      # url_launcher_ios 6.4.1, which requires Flutter 3.38 or later. Pinned rather than "stable"
      # so a release built next month is built by the same toolchain as one built today.
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Determine version
        id: version
        run: |
          # On a tag, the tag IS the version — otherwise apple-v1.0.2 would ship a release titled
          # with whatever pubspec happens to say, and a third TestFlight build with the same
          # number as the last two.
          case "$GITHUB_REF" in
            refs/tags/apple-v*) VERSION="${GITHUB_REF#refs/tags/apple-v}" ;;
            *) VERSION=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml) ;;
          esac
          [ -n "$VERSION" ] || VERSION="0.1.0"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          # The build number is the run number: it only ever goes up, which is all App Store
          # Connect asks, and nothing in the repository has to be bumped by hand.
          echo "BUILD=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION build ${{ github.run_number }}"

      # ── Always: the parts that need no signing ───────────────────────────

      - name: Analyze
        # --no-fatal-infos: two style infos in discogs.dart predate this workflow and are nobody's
        # emergency. Warnings and errors still stop the build.
        run: flutter analyze --no-fatal-infos lib/

      - name: Test
        # Named files rather than the whole suite: five tests in this repository scan
        # D:\Flac music 2024 or call out to the network, and would fail here for reasons that have
        # nothing to do with the build. These are the ones that cover what this workflow ships.
        run: |
          flutter test \
            test/lan_client_test.dart test/client_session_test.dart test/now_playing_test.dart \
            test/lan_server_test.dart test/lan_state_test.dart test/lan_pairing_test.dart \
            test/edition_split_test.dart test/artist_name_test.dart test/album_cover_key_test.dart \
            test/flac_tags_test.dart test/featured_test.dart \
            test/corrections_durability_test.dart test/player_refresh_test.dart \
            test/album_id_test.dart test/album_facts_test.dart test/lan_facts_test.dart \
            test/settings_durability_test.dart test/mb_browse_recordings_test.dart \
            test/facts_warmer_test.dart test/cast_discovery_test.dart

      - name: Build for the iPad (unsigned)
        # Proves the iOS build compiles even with no App Store Connect key configured.
        run: |
          flutter build ios --release --no-codesign \
            --build-name=${{ steps.version.outputs.VERSION }} \
            --build-number=${{ steps.version.outputs.BUILD }}

      - name: Build for the Mac (unsigned)
        run: |
          flutter build macos --release \
            --build-name=${{ steps.version.outputs.VERSION }} \
            --build-number=${{ steps.version.outputs.BUILD }}

      - name: Package the Mac app
        run: |
          mkdir -p out
          # ditto, not zip: it keeps the bundle's symlinks and resource forks intact, which a
          # plain zip quietly flattens into an app that will not launch.
          ditto -c -k --sequesterRsrc --keepParent \
            "build/macos/Build/Products/Release/DebridMusic.app" \
            "out/DebridMusic-macOS-${{ steps.version.outputs.VERSION }}.zip"

      - name: Upload the Mac app
        uses: actions/upload-artifact@v4
        with:
          name: DebridMusic-macOS-${{ steps.version.outputs.VERSION }}
          path: desktop/out/DebridMusic-macOS-*.zip
          retention-days: 30

      # ── From here: signing and distribution ──────────────────────────────
      #
      # Needs three repository secrets, all from App Store Connect → Users and Access → Keys:
      #   APPLE_API_KEY_ID       e.g. 5LP53KLDC3
      #   APPLE_API_ISSUER_ID    e.g. ce9a48ce-1bfd-43ca-9eb1-5bfaf726c589
      #   APPLE_API_PRIVATE_KEY  the whole contents of AuthKey_XXXXXXXX.p8
      #
      # The key must have Admin access: an App Manager key cannot create the certificates that
      # -allowProvisioningUpdates needs, and fails with an error that does not say so.
      #
      # No certificate or provisioning profile secrets: with the API key, -allowProvisioningUpdates
      # lets Xcode create and fetch what it needs itself, which avoids keeping a .p12 and its
      # password in the repository.
      #
      # The app record in App Store Connect is com.debridmedia.music — the same one the SwiftUI
      # app used, so TestFlight carries on from where it was rather than starting over.

      - name: Distribution ready?
        id: gate
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          if [ -n "$KEY_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No App Store Connect key configured — built and tested only. Add APPLE_API_KEY_ID, APPLE_API_ISSUER_ID and APPLE_API_PRIVATE_KEY to sign and publish."
          fi

      - name: Write the App Store Connect key
        if: steps.gate.outputs.ready == 'true'
        env:
          PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          # '%s\n', not '%s': the .p8 Apple hands you has no trailing newline, and some PEM
          # readers refuse a key that does not end in one — reporting an invalid key rather than
          # a missing line ending. An extra blank line after END PRIVATE KEY is harmless.
          printf '%s\n' "$PRIVATE_KEY" > ~/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${KEY_ID}.p8
          # Fail here, where the cause is obvious, rather than three steps later inside xcodebuild.
          openssl pkey -in ~/private_keys/AuthKey_${KEY_ID}.p8 -noout \
            || { echo "::error::APPLE_API_PRIVATE_KEY is not a readable private key"; exit 1; }

      # ── The signing certificate ──────────────────────────────────────────
      #
      # Imported from a secret rather than left to -allowProvisioningUpdates, and this is not a
      # preference: a runner is a fresh machine with an empty keychain, so Xcode minted a NEW
      # distribution certificate on every single run. Apple caps how many an account may have, and
      # after three releases the build failed with "your account has reached the maximum number of
      # certificates" — with the private keys of all of them already thrown away with the runners.
      #
      # Two more secrets, both made from ONE certificate that lives in your own keychain:
      #   APPLE_DIST_CERT_P12       base64 of the exported .p12
      #   APPLE_DIST_CERT_PASSWORD  the password set when exporting it
      #
      # Profiles are still fetched by -allowProvisioningUpdates below. Those are not capped; the
      # certificate was the scarce thing.
      - name: Import the signing certificate
        if: steps.gate.outputs.ready == 'true' && (startsWith(github.ref, 'refs/tags/apple-v') || inputs.testflight)
        env:
          CERT_P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "::error::APPLE_DIST_CERT_P12 is not set. Without it Xcode creates a new certificate every run and the account fills up."
            exit 1
          fi
          # A throwaway keychain, not the login one: the runner is discarded anyway, and this keeps
          # the certificate out of anything the rest of the job might touch.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this codesign stops to ask for permission, and a CI machine has nobody to ask.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Search list, not replace: the system roots have to stay reachable or nothing verifies.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"

          echo "Identiteiten in de keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # ── iPad → TestFlight ────────────────────────────────────────────────
      #
      # xcodebuild rather than `flutter build ipa`: the archive needs -allowProvisioningUpdates and
      # the three -authenticationKey* arguments, and flutter's own command passes none of them
      # through. The Flutter build above has already produced App.framework and the assets, so this
      # only archives what is there.
      #
      # Nothing sets PRODUCT_BUNDLE_IDENTIFIER here, on purpose. A build setting given on the
      # xcodebuild command line applies to EVERY target in the build, so passing the app's id also
      # stamped it on Mpv.framework, Avcodec.framework and the rest — and the upload was rejected
      # for "more than one bundle with the CFBundleIdentifier value com.debridmedia.music". The
      # project already carries the right id in both configurations.
      #
      # FLUTTER_BUILD_NAME/NUMBER, not MARKETING_VERSION/CURRENT_PROJECT_VERSION: Info.plist reads
      # $(FLUTTER_BUILD_NAME) and $(FLUTTER_BUILD_NUMBER), so the Xcode-native names are accepted
      # on the command line and then quietly ignored — TestFlight would keep seeing the version
      # from pubspec.yaml no matter what tag you pushed.

      - name: Archive for iOS
        if: steps.gate.outputs.ready == 'true' && (startsWith(github.ref, 'refs/tags/apple-v') || inputs.testflight)
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DebridMusic-iOS.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            FLUTTER_BUILD_NAME="${{ steps.version.outputs.VERSION }}" \
            FLUTTER_BUILD_NUMBER="${{ steps.version.outputs.BUILD }}" \
            archive

      - name: Export and upload to TestFlight
        if: steps.gate.outputs.ready == 'true' && (startsWith(github.ref, 'refs/tags/apple-v') || inputs.testflight)
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions-iOS.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>upload</string>
          </dict>
          </plist>
          PLIST
          # destination=upload hands it to App Store Connect directly, so there is no separate
          # altool step and no .ipa left lying around.
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DebridMusic-iOS.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-iOS.plist" \
            -exportPath "$RUNNER_TEMP/export-ios" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo "::notice::Uploaded to TestFlight. It appears after Apple's processing, usually 5-15 minutes."

      # The Mac app is NOT signed for distribution, on purpose.
      #
      # Notarising needs the Developer ID private key on the runner, and Apple's cloud signing
      # deliberately does not cover Developer ID — those certificates are limited and tied to the
      # account holder. The only way is to export the key into a repository secret, and for one
      # app on one Mac that is not worth putting private key material at a third party. The cost
      # is a right-click → Open the first time; the release notes say so.

      # `!cancelled()` rather than a plain tag check: this publishes the MAC zip, which was built
      # and packaged long before the iOS archive runs, and the two are separate products. A signing
      # problem on the iPad used to take the Mac release down with it — the zip existed, sat in the
      # run's artifacts, and never reached anybody. The job still goes red when iOS fails, so the
      # problem stays visible; it just no longer holds the Mac hostage.
      - name: GitHub Release (on an apple-v tag)
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/apple-v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/out/DebridMusic-macOS-*.zip
          name: DebridMusic ${{ steps.version.outputs.VERSION }} (Mac en iPad)
          body: |
            ## DebridMusic v${{ steps.version.outputs.VERSION }} — Mac en iPad

            Dezelfde app als op Windows. Zelfde schermen, zelfde functies —
            het is letterlijk dezelfde code.

            **Mac** — download de zip hieronder, pak uit en sleep naar Programma's.
            De eerste keer: **rechtsklik → Open** en bevestig. Daarna start hij
            gewoon. Dat is nodig omdat de app niet bij Apple is genotariseerd.

            **iPad** — via TestFlight. Verschijnt daar na Apple's verwerking,
            meestal binnen 5-15 minuten.

            Beide koppelen met je pc: open DebridMusic op de pc, ga naar
            **Instellingen → Apparaat koppelen** en typ de zes cijfers over.
            Je bibliotheek, je covers en je bewerkingen komen daarna vanzelf mee.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The runner is thrown away regardless, but leaving a signing certificate unlocked in a
      # default keychain for the rest of the job is not a habit worth having.
      - name: Remove the signing keychain
        if: always()
        run: |
          security default-keychain -s login.keychain-db 2>/dev/null || true
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
