name: DebridMusic Windows Build & Installer

# Native Flutter Windows app (in desktop/). Builds a real .exe + Inno Setup installer.
#   • tag win-v*        → build + GitHub Release
#   • workflow_dispatch → manual build (artifact)
on:
  push:
    tags:
      - 'win-v*'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version override (e.g. 0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          # Gelijk aan apple_build.yml en build-release.yml. Windows liep zes versies achter, en juist
          # daar zit het probleem: GEMETEN op een 144Hz-scherm haalt de draaiende plaat 70 beelden per
          # seconde terwijl bouwen 0,4ms en rasteren 0,6ms kost van een budget van 6,9ms. Het frame is
          # niet te duur, het BEGINT gemiddeld 10,4ms na de vsync-tik, en de UI-draad is dan 97% stil.
          # Dat wijst onder Dart, naar de framescheduling van de embedder.
          #
          # Een versie die op twee andere platforms al bouwt is de goedkoopste toets die er is.
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $override = "${{ github.event.inputs.version_override }}"
          $ref = "${{ github.ref }}"
          # The build number always comes from pubspec, whatever decides the NAME. Once
          # --build-name is passed, Flutter stops falling back to pubspec for the number
          # (flutter_tools/lib/src/cmake.dart), so leaving it out silently shipped an app whose
          # Info screen read "1.4.2" with no build at all.
          $content = Get-Content pubspec.yaml -Raw
          if ($content -match 'version:\s*[\d.]+\+(\d+)') { $build = $Matches[1] } else { $build = "1" }
          echo "BUILD=$build" >> $env:GITHUB_OUTPUT
          if ($override -ne "") {
            $version = $override
          } elseif ($ref -like "refs/tags/win-v*") {
            # On a tag, the TAG is the version. Reading pubspec here meant win-v1.4.0 shipped an
            # installer called 1.3.0 — the release, the filename and the tag all disagreeing, with
            # no way to tell from the download which code you were getting.
            $version = $ref -replace '^refs/tags/win-v', ''
          } else {
            $content = Get-Content pubspec.yaml -Raw
            if ($content -match 'version:\s*([\d]+\.[\d]+\.[\d]+)') { $version = $Matches[1] } else { $version = "0.1.0" }
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"

      - name: Build Windows (release)
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          # --build-name, or the version INSIDE the app still comes from pubspec while the filename
          # comes from the tag. That is the same disagreement the step above fixes, one layer down:
          # win-v1.4.0 installed an app whose Settings screen read 1.3.0, so there was no way to
          # tell from the running app which build you had.
          flutter build windows --release --build-name=${{ steps.version.outputs.VERSION }} --build-number=${{ steps.version.outputs.BUILD }}

      - name: Verify build output
        shell: pwsh
        run: |
          $dir = "build\windows\x64\runner\Release"
          if (-not (Test-Path "$dir\debridmusic.exe")) { echo "MISSING: $dir\debridmusic.exe"; Get-ChildItem $dir; exit 1 }
          echo "OK: $dir\debridmusic.exe"

      # Chromaprint's fpcalc: turns audio into the numbers that say what a recording IS, regardless
      # of how it is tagged. 1.7 MB zipped, next to the app's own exe — the installer copies this
      # whole folder, so nothing downstream needs to know it is here.
      #
      # Only on the machine that holds the music. A phone or a television has no files to fingerprint
      # and asks the PC for facts anyway, so there is no Android or iOS binary to ship.
      #
      # Pinned to a version, not "latest": a build that quietly changes its fingerprint algorithm
      # would invalidate every cached fingerprint on every user's disk without a line of code moving.
      - name: Bundle fpcalc (Chromaprint)
        shell: pwsh
        run: |
          $ver = "1.6.1"
          $url = "https://github.com/acoustid/chromaprint/releases/download/v$ver/chromaprint-fpcalc-$ver-windows-x86_64.zip"
          . "$env:GITHUB_WORKSPACE/.github/haal.ps1"
          Haal $url "fpcalc.zip"
          Expand-Archive "fpcalc.zip" -DestinationPath "fpcalc_tmp" -Force
          $exe = (Get-ChildItem "fpcalc_tmp" -Recurse -Filter "fpcalc.exe" | Select-Object -First 1).FullName
          if (-not $exe) { echo "fpcalc.exe niet gevonden in de zip"; exit 1 }
          Copy-Item $exe "build\windows\x64\runner\Release\fpcalc.exe" -Force
          $dest = "build\windows\x64\runner\Release\fpcalc.exe"
          if (-not (Test-Path $dest)) { echo "MISSING: $dest"; exit 1 }
          echo "OK: fpcalc $ver ($([math]::Round((Get-Item $dest).Length/1MB,1)) MB)"

      # aria2: torrents binnenhalen zonder tussenpersoon.
      #
      # Waarom dit meegaat. De app haalde alles via TorBox, en op 23-08-2026 lag hun API er een uur
      # uit: 504's en een omleiding naar hun eigen statuspagina, terwijl dezelfde plaat in µTorrent
      # op 6 MB/s binnenkwam. Met aria2 ernaast kan deze pc het zelf, en dat is bovendien sneller
      # voor alles wat TorBox nog niet in de cache heeft staan — die moet de torrent dan namelijk
      # eerst helemaal zelf ophalen.
      #
      # Alleen op de machine met de muziek, net als fpcalc: een telefoon vraagt het de pc.
      #
      # Vastgezet op een versie ÉN op zijn vingerafdruk. Dit is een programma dat namens de gebruiker
      # verbindingen opzet; een zip die onderweg iets anders wordt hoort de build te laten vallen, niet
      # stilletjes mee te reizen naar iedereens pc.
      - name: Bundle aria2 (lokale torrentmotor)
        shell: pwsh
        run: |
          $ver = "1.37.0"
          $sha = "67d015301eef0b612191212d564c5bb0a14b5b9c4796b76454276a4d28d9b288"
          $url = "https://github.com/aria2/aria2/releases/download/release-$ver/aria2-$ver-win-64bit-build1.zip"
          . "$env:GITHUB_WORKSPACE/.github/haal.ps1"
          Haal $url "aria2.zip"
          $echt = (Get-FileHash "aria2.zip" -Algorithm SHA256).Hash.ToLower()
          if ($echt -ne $sha) { echo "aria2.zip heeft een ANDERE vingerafdruk: $echt (verwacht $sha)"; exit 1 }
          Expand-Archive "aria2.zip" -DestinationPath "aria2_tmp" -Force
          $exe = (Get-ChildItem "aria2_tmp" -Recurse -Filter "aria2c.exe" | Select-Object -First 1).FullName
          if (-not $exe) { echo "aria2c.exe niet gevonden in de zip"; exit 1 }
          Copy-Item $exe "build\windows\x64\runner\Release\aria2c.exe" -Force
          $dest = "build\windows\x64\runner\Release\aria2c.exe"
          if (-not (Test-Path $dest)) { echo "MISSING: $dest"; exit 1 }
          echo "OK: aria2 $ver ($([math]::Round((Get-Item $dest).Length/1MB,1)) MB)"

      - name: Download VC++ Redistributable
        shell: pwsh
        run: |
          . "$env:GITHUB_WORKSPACE/.github/haal.ps1"
          Haal "https://aka.ms/vs/17/release/vc_redist.x64.exe" "vc_redist.x64.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { echo "Inno Setup missing"; exit 1 }

      - name: Write installer script
        shell: pwsh
        run: |
          $ver      = "${{ steps.version.outputs.VERSION }}"
          $wsDesktop = (Get-Location).Path
          $buildDir = "$wsDesktop\build\windows\x64\runner\Release"
          $icoFile  = "$wsDesktop\windows\runner\resources\app_icon.ico"
          $vcRedist = "$wsDesktop\vc_redist.x64.exe"
          $outDir   = "$wsDesktop\installer_output"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $useIcon = (Test-Path $icoFile) -and ((Get-Item $icoFile).Length -gt 500)

          $L = [System.Collections.Generic.List[string]]::new()
          $L.Add("[Setup]")
          $L.Add("AppId={{6D2B9E4C-4E2A-4C7E-9F3A-DEBR1DMUS1C01}")
          $L.Add("AppName=DebridMusic")
          $L.Add("AppVersion=$ver")
          $L.Add("AppVerName=DebridMusic $ver")
          $L.Add("AppPublisher=DebridMusic")
          $L.Add("DefaultDirName={autopf}\DebridMusic")
          $L.Add("DefaultGroupName=DebridMusic")
          $L.Add("AllowNoIcons=yes")
          $L.Add("OutputDir=$outDir")
          $L.Add("OutputBaseFilename=DebridMusic-Setup-v$ver")
          if ($useIcon) { $L.Add("SetupIconFile=$icoFile") }
          $L.Add("Compression=lzma2/ultra64")
          $L.Add("SolidCompression=yes")
          $L.Add("WizardStyle=modern")
          $L.Add("PrivilegesRequired=lowest")
          $L.Add("ArchitecturesAllowed=x64compatible")
          $L.Add("ArchitecturesInstallIn64BitMode=x64compatible")
          $L.Add("")
          $L.Add("[Languages]")
          $L.Add('Name: "dutch"; MessagesFile: "compiler:Languages\Dutch.isl"')
          $L.Add('Name: "english"; MessagesFile: "compiler:Default.isl"')
          $L.Add("")
          $L.Add("[Tasks]")
          $L.Add('Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"')
          $L.Add("")
          $L.Add("[Files]")
          $L.Add("Source: `"$buildDir\*`"; DestDir: `"{app}`"; Flags: ignoreversion recursesubdirs createallsubdirs")
          $L.Add("Source: `"$vcRedist`"; DestDir: `"{tmp}`"; Flags: deleteafterinstall")
          $L.Add("")
          $L.Add("[Icons]")
          $L.Add('Name: "{group}\DebridMusic"; Filename: "{app}\debridmusic.exe"')
          $L.Add('Name: "{group}\{cm:UninstallProgram,DebridMusic}"; Filename: "{uninstallexe}"')
          $L.Add('Name: "{autodesktop}\DebridMusic"; Filename: "{app}\debridmusic.exe"; Tasks: desktopicon')
          $L.Add("")
          $L.Add("[Run]")
          $L.Add('Filename: "{tmp}\vc_redist.x64.exe"; Parameters: "/install /quiet /norestart"; StatusMsg: "Visual C++ Runtime installeren..."; Flags: waituntilterminated')
          $L.Add('Filename: "{app}\debridmusic.exe"; Description: "{cm:LaunchProgram,DebridMusic}"; Flags: nowait postinstall skipifsilent')
          # Bij een STILLE installatie start de regel hierboven de app niet: `postinstall` is het
          # vinkje op het slotscherm, en dat scherm bestaat daar niet. Precies dat gebeurt bij
          # bijwerken vanuit de app -- die roept de installer aan met /SILENT.
          #
          # /RESTARTAPPLICATIONS hoort de app al terug te zetten via de Restart Manager, maar dat
          # hangt ervan af of Windows hem daar herkend heeft. Deze regel is het vangnet, en dubbel
          # starten is onschadelijk: de app houdt een poort vast als eenmalige grendel en een tweede
          # kopie meldt zich bij de eerste en sluit zichzelf (zie _instancePort in main.dart).
          $L.Add('Filename: "{app}\debridmusic.exe"; Flags: nowait; Check: StilleInstallatie')
          $L.Add("")
          $L.Add("[Code]")
          $L.Add("function StilleInstallatie: Boolean;")
          $L.Add("begin")
          $L.Add("  Result := WizardSilent;")
          $L.Add("end;")
          $L | Out-File -FilePath "installer.iss" -Encoding UTF8

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { echo "Inno Setup failed"; exit 1 }
          Get-ChildItem installer_output\ | Format-Table Name, @{N='MB';E={[math]::Round($_.Length/1MB,1)}} -AutoSize

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DebridMusic-Windows-v${{ steps.version.outputs.VERSION }}
          path: desktop/installer_output/*.exe
          retention-days: 30

      - name: GitHub Release (on win-v tag)
        if: startsWith(github.ref, 'refs/tags/win-v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/installer_output/*.exe
          name: DebridMusic ${{ steps.version.outputs.VERSION }} (Windows)
          body: |
            ## DebridMusic v${{ steps.version.outputs.VERSION }} — native Windows app
            Download and run the Setup.exe. Requires Windows 10/11 (64-bit).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
